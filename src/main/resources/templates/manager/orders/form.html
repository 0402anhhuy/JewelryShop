<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/manager.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{manager/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div th:replace="~{manager/layout/header :: header}"></div>

        <main class="p-4 bg-light">
            <div class="container">
                <h4 class="fw-bold text-primary mb-4">
                    <i class="bi bi-pencil-square me-2"></i> Cập nhật đơn hàng
                </h4>

                <form th:action="@{/manager/orders/update}" th:object="${order}" method="post"
                      class="card p-4 shadow-sm border-0">
                    <input type="hidden" th:field="*{id}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mã đơn hàng</label>
                        <input type="text" th:value="*{id}" class="form-control" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Trạng thái đơn hàng</label>
                        <select class="form-select" name="status" id="statusSelect" th:field="*{status}" onchange="handleStatusChange()">
                            <option value="PENDING">Chờ xử lý</option>
                            <option value="PAID">Đã thanh toán</option>
                            <option value="SHIPPING">Đang giao</option>
                            <option value="COMPLETED">Hoàn tất</option>
                            <option value="CANCELLED">Đã hủy</option>
                            <option value="CANCELLED">Trả hàng</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phân công Shipper</label>
                        <select class="form-select" th:field="*{shipper.id}">
                            <option th:value="${null}">-- Chưa gán --</option>
                            <option th:each="s : ${shippers}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Thanh toán</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="paid" id="paidCheck"
                                   th:checked="${order.paid}"
                                   onchange="togglePaidStatus(this)">
                            <label class="form-check-label" for="paidCheck">Đã thanh toán</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tổng tiền</label>
                        <input type="text"
                               th:value="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' ₫'"
                               class="form-control" disabled>

                    </div>

                    <div class="text-end">
                        <a th:href="@{/manager/orders}" class="btn btn-secondary me-2">
                            <i class="bi bi-arrow-left"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Cập nhật
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <div th:replace="~{manager/layout/footer :: footer}"></div>
    </div>
</div>
<script>
    const statusSelect = document.getElementById("statusSelect");
    const paidCheck = document.getElementById("paidCheck");

    // 🔹 Khi tick vào checkbox "Đã thanh toán"
    function togglePaidStatus(checkbox) {
        if (checkbox.checked) {
            // ✅ Nếu tick -> đổi trạng thái sang PAID
            statusSelect.value = "PAID";
        } else {
            // 🔄 Nếu bỏ tick -> quay về PENDING (hoặc giữ nguyên nếu đang giao)
            if (statusSelect.value === "PAID") {
                statusSelect.value = "PENDING";
            }
        }
    }

    // 🔹 Khi chọn trạng thái trong dropdown
    function handleStatusChange() {
        const value = statusSelect.value;

        if (value === "CANCELLED") {
            // ❌ Nếu chọn "Đã hủy" -> tự bỏ tick thanh toán
            paidCheck.checked = false;
        }
        else if (value === "PAID") {
            // ✅ Nếu chọn "Đã thanh toán" -> tự tick checkbox
            paidCheck.checked = true;
        }
    }
</script>


</body>
</html>
